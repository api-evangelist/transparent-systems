name: Transparent Systems
description: 'Transparent Systems (Transparent Financial Systems) was a Seattle-based
  fintech startup advancing financial infrastructure through on-demand, 24/7 cryptographic
  settlement solutions built on cryptographically-secured distributed networks, backed
  by Pantera Capital and Vulcan Capital and active in US regulatory engagement (OCC
  comments, 2020). The company appears defunct: its website redirected away from 2021
  onward and as of July 2026 transparentsystems.com is a parked GoDaddy domain listed
  for sale, with no developer portal, documentation, or public API surface.'
